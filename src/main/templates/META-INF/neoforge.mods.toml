modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]


modId="${mod_id}"

version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
description='''
Adds custom item icons to Xaero waypoints.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="xaerominimap"
    type="required"
    versionRange="${xaero_minimap_version_range}"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="xaeroworldmap"
    type="optional"
    versionRange="${xaero_world_map_version_range}"
    ordering="AFTER"
    side="CLIENT"

[[mixins]]
config="${mod_id}.mixins.json"